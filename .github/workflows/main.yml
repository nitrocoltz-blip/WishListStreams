name: Actualizar y publicar wishlist

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Descargar wishlist de Steam
        id: steam
        continue-on-error: true
        run: python scripts/update-wishlist.py

      - name: Avisar si Steam ha fallado
        if: steps.steam.outcome == 'failure'
        run: echo "::warning::No se pudo leer la wishlist de Steam. Se publica la última versión guardada. Revisa que el perfil y los detalles de juego sean públicos."

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wishlist.json
          git diff --cached --quiet || (git commit -m "Actualizar wishlist" && git push)

      - name: Preparar la web
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
